<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netplay Rollback Test</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #090a0f;
      color: #f4f7ff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 20px;
      box-sizing: border-box;
    }
    main {
      width: min(960px, 100%);
      display: grid;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }
    p {
      margin: 0;
      color: #aeb6c8;
      line-height: 1.5;
    }
    .screen {
      width: 100%;
      aspect-ratio: 4 / 3;
      border: 2px solid #3b4257;
      background: #000;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }
    .note {
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>NetplayJS Rollback Test</h1>
    <p>Use this page to test free browser P2P rollback before moving the main game. Move with arrow keys or WASD.</p>
    <div class="screen" id="screen"></div>
    <p class="note">If NetplayJS connects correctly, two browsers should control separate squares with rollback-style input sync.</p>
  </main>

  <script src="https://unpkg.com/netplayjs@0.4.1/dist/netplay.js" integrity="sha384-6Yb8LWAT488jwK+nIjvD4S5/poq1Xn69NYjH1RXKHoaUOaFJrKQ1rfGQgKm8oQjX" crossorigin="anonymous"></script>
  <script>
    class RollbackTestGame extends netplayjs.Game {
      static timestep = 1000 / 60;
      static canvasSize = { width: 640, height: 480 };

      constructor() {
        super();
        this.players = [
          { x: 190, y: 240, color: "#45a8ff" },
          { x: 450, y: 240, color: "#ff8a3d" },
        ];
      }

      tick(playerInputs) {
        for (const [player, input] of playerInputs.entries()) {
          const id = player.getID();
          const target = this.players[id];
          if (!target) continue;
          const velocity = input.arrowKeys();
          target.x += velocity.x * 4.4;
          target.y -= velocity.y * 4.4;
          target.x = Math.max(26, Math.min(614, target.x));
          target.y = Math.max(26, Math.min(454, target.y));
        }
      }

      serialize() {
        return {
          players: this.players.map(player => ({
            x: player.x,
            y: player.y,
            color: player.color,
          })),
        };
      }

      deserialize(value) {
        this.players = value.players.map(player => ({
          x: player.x,
          y: player.y,
          color: player.color,
        }));
      }

      draw(canvas) {
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#080a12";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#2b3348";
        ctx.lineWidth = 3;
        ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);

        ctx.fillStyle = "#c8d2e8";
        ctx.font = "16px monospace";
        ctx.fillText("Rollback test", 28, 44);

        this.players.forEach((player, index) => {
          ctx.fillStyle = player.color;
          ctx.fillRect(player.x - 20, player.y - 20, 40, 40);
          ctx.fillStyle = "#ffffff";
          ctx.font = "18px monospace";
          ctx.fillText(String(index + 1), player.x - 6, player.y + 7);
        });
      }
    }

    const wrapper = new netplayjs.RollbackWrapper(RollbackTestGame);
    wrapper.start(document.getElementById("screen"));
  </script>
</body>
</html>
